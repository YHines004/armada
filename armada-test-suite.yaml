name: Armada Test Suite

on:
  # schedule:
  #   - cron: "0 0 * * *" # daily at midnight UTC
  # workflow_dispatch:
  push:
    branches:
      - dev/testsuite

permissions:
  id-token: write

jobs:
  test-suite:
    name: Run Armada Dev Test Suite
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: "us-east-2"
      OIDC_ROLE: ${{ secrets.OIDC_ROLE }}
      EKS_CLUSTER_NAME: tectonic-dev-cluster

    steps:
      - uses: actions/create-github-app-token@a1cbe0fa3c5aa6b13e7437f226536549d68ed0dd # v2.1.0
        id: generate_token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - run: git config --global url."https://git:${GH_TOKEN}@github.com".insteadOf "https://github.com"
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.generate_token.outputs.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Install armadactl
        run: |
          VERSION=$(curl -s https://api.github.com/repos/armadaproject/armada/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          curl -fsSL "https://github.com/armadaproject/armada/releases/download/v${VERSION}/armadactl_${VERSION}_linux_amd64.tar.gz" -o armadactl.tar.gz
          tar -xzf armadactl.tar.gz armadactl
          sudo mv armadactl /usr/local/bin/armadactl

      - name: Configure armadactl
        run: |
          cat <<EOF > ~/.armadactl.yaml
          currentContext: main
          contexts:
            main:
              armadaUrl: "${{ secrets.ARMADA_SERVER }}"
          EOF
          armadactl --config ~/.armadactl.yaml version
          armadactl --config ~/.armadactl.yaml get queues

      # - name: Run test suite
      #   working-directory: environments/dev/applications/armada/test-suite
      #   run: bash run_workload_suite.sh

